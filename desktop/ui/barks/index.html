<!doctype html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="离线编辑 Remains 角色在不同场景中随机说出的台词。">
<title>角色台词工坊 · Remains</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b624f'/%3E%3Cpath d='M14 16h36v26H30l-10 8v-8h-6z' fill='%23f6f1df'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#" id="brand" aria-label="角色台词工坊，回到玩家场景">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 5h22v16H15l-7 6v-6H5z"/><path d="M10 11h12M10 15h8"/></svg></span>
      <strong>角色台词</strong>
    </a>
    <div class="top-actions">
      <button class="button quiet" id="open-button"><span aria-hidden="true">↗</span> 打开文件</button>
      <button class="button" id="save-project">保存草稿</button>
      <button class="button primary" id="export-button">导出给游戏 <span aria-hidden="true">→</span></button>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="角色与场景导航">
      <div class="sidebar-heading"><label class="field-label" for="speaker-select">角色</label><span class="language-pill" id="language-label">简体中文</span></div>
      <select id="speaker-select" aria-label="选择说话的角色"></select>
      <div class="section-label">场景</div>
      <nav id="scene-list" aria-label="选择发话场景"></nav>
      <div class="sidebar-footer">
        <p id="source-label"></p>
        <button class="text-button" id="source-info">文件状态</button>
      </div>
    </aside>
    <main id="main" class="main-panel">
      <div class="scene-heading">
        <h1 id="scene-title">正在读取…</h1>
        <div class="history-buttons"><button id="undo" class="icon-button" aria-label="撤销上一次修改" title="撤销" disabled>↶</button><button id="redo" class="icon-button" aria-label="重做上一次修改" title="重做" disabled>↷</button></div>
      </div>
      <div class="search-row"><label class="search-box"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="m12 12 5 5"/></svg><input id="search" type="search" placeholder="搜索台词" aria-label="搜索所有角色的台词"></label><button class="button" id="add-line">＋ 添加一句</button></div>
      <div class="list-heading"><span id="list-count"></span><label class="compact-select"><span class="sr-only">筛选句子</span><select id="list-filter"><option value="all">全部句子</option><option value="changed">只看修改过的</option><option value="disabled">只看暂时不用的</option><option value="marked">只看含粗口的</option></select></label></div>
      <div id="line-list" class="line-list"></div>
      <div class="main-bottom"><span id="save-status" role="status">正在读取…</span><button class="text-button" id="review-changes">查看修改</button></div>
    </main>
    <aside class="preview-panel" aria-label="台词预览">
      <div class="preview-heading"><h2>台词预览</h2><span class="live-dot" aria-label="实时预览"></span></div>
      <div class="preview-stage">
        <div class="stage-stars" aria-hidden="true">✧<span>·</span>✦</div>
        <div id="speech-bubble" class="speech-bubble"></div>
        <div class="stage-character"><span class="avatar" id="preview-avatar">你</span><span id="preview-speaker">玩家</span></div>
        <div class="stage-ground" aria-hidden="true"></div>
      </div>
      <p id="preview-reason" class="preview-reason"></p>
      <div class="preview-controls">
        <label class="field-label" for="preview-name">玩家名字</label><input id="preview-name" type="text" value="Littlepip" maxlength="80">
        <div id="sex-control"><label class="field-label" for="preview-sex">角色用词</label><select id="preview-sex"><option value="female">女性说法</option><option value="male">男性说法</option></select></div>
        <label class="check-row"><input type="checkbox" id="preview-filter" checked><span>粗口过滤</span></label>
        <button class="button full-width" id="sample-button">随机一句 <span aria-hidden="true">↻</span></button>
      </div>
      <details class="notes-box"><summary>草稿备注</summary><label class="sr-only" for="line-note">所选句子的备注</label><textarea id="line-note" rows="3"></textarea></details>
    </aside>
  </div>
  <footer class="page-footer"><span id="total-count"></span><button class="text-button" id="check-button">检查台词</button></footer>
</div>
<input id="file-input" type="file" accept=".xml,.json" class="sr-only" aria-label="打开游戏文本或台词草稿">
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button class="icon-button" id="modal-close" aria-label="关闭对话框">×</button></div><div id="modal-body"></div><div id="modal-actions"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fatal" hidden></div>
<noscript>请通过 RModifier 打开角色台词页。</noscript>

<script src="../../barks/core.js"></script>
<script src="../../barks/catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
