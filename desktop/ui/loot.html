<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>掉落工坊 · Remains</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">◈</span><div>掉落编辑</div></div><div class="profile-heading"><select id="profileSelect" aria-label="当前方案"></select><span id="dirtyLabel" class="badge">只读</span></div><div class="tools"><button id="undo" title="撤销（Ctrl+Z）">↶ 撤销</button><button id="redo" title="重做（Ctrl+Y）">↷ 重做</button><button id="save">保存方案</button><button id="apply" class="primary">应用方案 <span>↗</span></button></div></header>
<nav class="tabs" aria-label="编辑内容"><button data-tab="container" class="active">▣ 容器奖励</button><button data-tab="enemy">♟ 敌人战利品</button><button data-tab="ammo">▥ 对应弹药</button><button data-tab="profiles">▤ 我的方案</button><span>1.02 · 单人游戏</span></nav>
<div id="notice" role="status" aria-live="polite"></div>
<main id="workspace"><aside id="sources" class="sources"><div class="aside-title"><strong id="sourceTitle">选择容器</strong><span id="sourceCount"></span></div><label class="search"><span>⌕</span><input id="sourceSearch" type="search" placeholder="搜索名称" aria-label="搜索容器或敌人"></label><select id="factionFilter" aria-label="筛选阵营" hidden><option value="all">全部阵营</option></select><select id="scopeFilter" aria-label="查看范围"><option value="table">按共享奖励分类</option><option value="model">按具体型号</option></select><div id="sourceList" class="source-list"></div></aside><section id="editor" class="editor" aria-live="polite"></section><aside id="preview" class="preview"></aside></main>
<footer><span id="gameStatus">正在检查游戏…</span><div><button id="connectGame">连接游戏</button><button id="refreshStatus">刷新状态</button><button id="chooseGame">选择游戏位置</button></div></footer>
<dialog id="itemDialog"><div class="dialog-header"><h2>选择奖励物品</h2><button id="closeItems" aria-label="关闭物品选择">✕</button></div><div class="picker-tools"><label class="search"><span>⌕</span><input id="itemSearch" type="search" placeholder="搜索物品" aria-label="搜索物品"></label><select id="itemCategory" aria-label="物品类别"><option value="all">全部物品</option><option value="a">弹药</option><option value="weapon">武器</option><option value="advanced">进阶武器</option><option value="armor">护甲</option><option value="med">医疗</option><option value="food">食物</option><option value="book">书籍</option><option value="materials">材料</option></select></div><div id="itemList" class="item-list"></div></dialog>
<script src="loot-bridge.js"></script><script type="module" src="app.js"></script></body></html>
