<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>地图编辑</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong id="filename">我的地图</strong><span id="saved">尚未打开</span></div><div class="actions"><select id="newKind" aria-label="新地图类型"><option value="random">随机房间集合</option><option value="fixed">固定地图</option></select><button id="new">新建地图</button><button id="open">打开地图</button><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="save">保存地图</button><button id="saveAs">另存一份</button></div></header>
<p id="notice" role="status">从左侧选择房间。地图中的物品和脚本只会在游戏运行时执行。</p>
<main><aside class="rooms"><h2>这份地图的房间</h2><input id="roomSearch" placeholder="搜索房间名称" aria-label="搜索房间"><div id="roomList"></div><button id="addRoom">＋ 添加空房间</button><button id="copyRoom">复制当前房间</button><button id="removeRoom">删除当前房间</button></aside>
<section class="work"><div class="tools"><label>操作<select id="tool"><option value="select">选择 / 移动物体</option><option value="paint">绘制地形</option><option value="place">放置物体</option><option value="erase">擦除</option></select></label><label>编辑层<select id="layer"><option value="1">实体地形（可站立）</option><option value="2">后方墙面</option><option value="3">表面装饰</option><option value="4">细节装饰</option><option value="5">水</option><option value="obj">物体 / 角色 / 触发点</option><option value="back">背景装饰物</option></select></label><label>地形高度<select id="shape"><option value="0">整格</option><option value="1">3/4 格</option><option value="2">半格</option><option value="3">1/4 格</option></select></label><label class="palette">素材<input id="paletteSearch" placeholder="搜索中文名称或编号"><select id="palette" aria-label="绘制素材"></select></label></div>
<div class="layers"><label><input id="front" type="checkbox" checked>地形</label><label><input id="back" type="checkbox" checked>后墙</label><label><input id="objects" type="checkbox" checked>物体</label><label><input id="backgrounds" type="checkbox" checked>背景物</label><label><input id="labels" type="checkbox" checked>中文标签</label><label><input id="ids" type="checkbox">编号</label><label>缩放<select id="zoom"><option value="0.4">40%</option><option value="0.5" selected>50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option></select></label><button id="editView">编辑画布</button></div>
<div id="viewport" tabindex="0" aria-label="地图画布，按住空格或鼠标中键拖动"><canvas id="canvas" width="1920" height="1000"></canvas><div id="empty"><b>在这里设计你的房间</b><p>新建一份空地图，或打开 Rooms 里的现有地图。<br>改动前会自动留下可恢复的工作草稿。</p></div></div>
<div class="preview-controls"><label>地区<select id="region"><option value="">自动识别地区</option></select></label><label>强度<input id="difficulty" type="number" min="-1" max="1000" value="-1" aria-label="预览强度，负一为自动"></label><span>−1 为自动</span><label><input id="mirror" type="checkbox">镜像</label><label><input id="nativeObjects" type="checkbox" checked>静态物体</label><label><input id="entities" type="checkbox" checked>固定角色</label><label><input id="examples" type="checkbox" checked>随机点示例</label><button id="preview" class="primary">查看游戏画面</button><button id="png" disabled>导出 PNG</button></div><p class="hint" id="previewNote">游戏画面由原生素材绘制。随机点仅作示例，不运行 AI、剧情或游戏主循环。按住空格拖动画布。</p></section>
<aside class="properties"><h2>当前选择</h2><div id="properties"><p>点击物体后，可以在这里修改位置和属性。</p></div><h2>房间设置</h2><div id="roomProps"></div><details><summary>房间脚本与其他内容</summary><p>原有脚本完整保留。仅在了解用途时修改这段内容。</p><textarea id="roomXML" rows="10" spellcheck="false"></textarea><button id="applyRoomXML">保存这段房间内容</button></details><details><summary>地区设置</summary><textarea id="landXML" rows="6" spellcheck="false"></textarea><button id="applyLandXML">保存地区设置</button></details><h2>本房间物体</h2><div id="objectList"></div></aside></main>
<dialog id="dialog"><h2 id="dialogTitle"></h2><label id="dialogLabel"></label><input id="dialogValue"><div><button id="dialogCancel">取消</button><button id="dialogOK" class="primary">确定</button></div></dialog>
<script src="../../map/xml.js"></script><script src="../../map/labels.js"></script><script src="../../map/document.js"></script><script src="catalog.js"></script><script src="app.js"></script></body></html>
